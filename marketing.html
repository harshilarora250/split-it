<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thanks for signing up</title>
<style>
    body {
        margin: 0;
        padding: 0;
        background-color: #f0f1f5;
        font-family: Arial, Helvetica, sans-serif;
    }

    .container {
        max-width: 600px;
        margin: 40px auto;
        background: #e1e6e8;
        padding: 40px 30px;
        text-align: center;
        border-radius: 12px;
        color: #05375a;
    }

    h1 {
        font-size: 32px;
        margin-bottom: 20px;
    }

    p {
        font-size: 16px;
        line-height: 1.5;
    }

    .button {
        display: inline-block;
        margin-top: 25px;
        padding: 14px 30px;
        background: #8c7b44;
        color: white;
        text-decoration: none;
        border-radius: 30px;
        font-size: 17px;
    }
</style>
</head>

<body>
    <div class="container">
        <h1>Thanks for signing up!</h1>

        <p>
            Welcome to SendIt. We're excited to have you with us.
            You'll start receiving updates and important information soon.
        </p>

        <a class="button" href="#">
            Get Started
        </a>
    </div>
</body>
</html>
